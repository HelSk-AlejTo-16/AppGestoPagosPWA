spring.cloud.config.enabled=false
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EnviromentProject}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:linux123}

# Configuración de MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/EnviromentProject}

# Credenciales de GestoPago (Administradas mediante variables de entorno o archivo .env local no versionado)
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
gestopago.auth.token-estatico=${GESTOPAGO_STATIC_TOKEN:}
gestopago.auth.api-key=${GESTOPAGO_API_KEY:}
# Modo simulación para pruebas académicas y demostraciones de flujo
gestopago.simulacion.enabled=${GESTOPAGO_SIMULACION_ENABLED:true}

# Timeouts y seguridad de logs para Feign (Evita cuelgues y evita exponer cabeceras Authorization en logs)
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.default.logger-level=none
spring.cloud.openfeign.client.config.gestoPagoAuth.logger-level=none
spring.cloud.openfeign.client.config.gestoPagoTx.logger-level=none
spring.cloud.openfeign.client.config.gestoPagoProduct.logger-level=none

#Configuración CRON
#gestopago.sync.cron=0 * * * * ?
gestopago.sync.cron=0 25 22 * * ?

# Saldo inicial asignado por el sistema a cada nueva cuenta.
bank.account.initial-balance=0.00
bank.clabe.institution-code=${BANK_CLABE_INSTITUTION_CODE:001}
bank.clabe.plaza-code=${BANK_CLABE_PLAZA_CODE:180}

# Define JWT_SECRET en el entorno (mínimo 32 bytes; admite prefijo base64:).
app.jwt.secret=${JWT_SECRET:base64:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw==}
app.jwt.expiration-ms=3600000

# Configuración del usuario administrador inicial
app.admin.seed-enabled=${APP_ADMIN_SEED_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@banco.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin#123456}

app.admin.password=${APP_ADMIN_PASSWORD:Admin#123456}