# Entorno de demostración académica; los códigos CLABE no son bancarios reales.
bank.clabe.institution-code=999
bank.clabe.plaza-code=001
gestopago.auth.refresh-enabled=${GESTOPAGO_REFRESH_ENABLED:false}
gestopago.sync.enabled=${GESTOPAGO_SYNC_ENABLED:true}
gestopago.simulacion.enabled=${GESTOPAGO_SIMULACION_ENABLED:true}
gestopago.auth.token-estatico=${GESTOPAGO_STATIC_TOKEN:}
gestopago.auth.api-key=${GESTOPAGO_API_KEY:}

# MongoDB Atlas se configura mediante MONGODB_URI; Mongo no bloquea la salud HTTP.
management.health.mongo.enabled=false
